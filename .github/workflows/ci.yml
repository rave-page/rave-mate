# Build + test + static analysis. repo root = rave-mate, a self-contained Go module
# (shared code folded into internal/shared).
name: CI

on:
  push:
    branches: [main, master, development]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Linux GL/X11 deps (Fyne)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev libxkbcommon-dev
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: gofmt
        if: runner.os == 'Linux'
        shell: bash
        run: |
          out=$(gofmt -l . | grep -v '^third_party/' || true)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Linux GL/X11 deps (Fyne)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev libxkbcommon-dev
      - uses: golangci/golangci-lint-action@v6
        with:
          args: --timeout=10m
